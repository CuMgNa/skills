  <path d="M520 0 V1000" stroke="#fff" stroke-width="12"/>
  <path d="M0 820 H750" stroke="#fff" stroke-width="12"/>
  <path d="M80 300 Q200 420 250 580" fill="none" stroke="#fff" stroke-width="10"/>
