  <rect x="60" y="560" width="110" height="90" fill="#f5f7fa" stroke="#c5ced8" stroke-width="1"/>
  <rect x="400" y="720" width="150" height="100" fill="#f0f3f7" stroke="#c5ced8" stroke-width="1"/>
  <!-- roads -->
  <path d="M0 300 H750" stroke="#fff" stroke-width="18"/>
