<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1000" viewBox="0 0 750 1000">
  <rect width="750" height="1000" fill="#e8eef3"/>
  <rect x="0" y="0" width="750" height="1000" fill="#dfe8f0"/>
  <!-- parks -->
  <rect x="80" y="160" width="160" height="120" rx="8" fill="#c5e0c5"/>
  <rect x="480" y="520" width="180" height="140" rx="8" fill="#c5e0c5"/>
  <rect x="200" y="700" width="140" height="100" rx="8" fill="#c8e6c8"/>
  <!-- blocks -->
  <rect x="280" y="140" width="120" height="90" fill="#f5f7fa" stroke="#c5ced8" stroke-width="1"/>
  <rect x="420" y="200" width="100" height="80" fill="#f5f7fa" stroke="#c5ced8" stroke-width="1"/>
  <rect x="100" y="360" width="140" height="110" fill="#f0f3f7" stroke="#c5ced8" stroke-width="1"/>
