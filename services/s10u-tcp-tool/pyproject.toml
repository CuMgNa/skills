[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "s10u-tcp-tool"
version = "0.1.0"
description = "Local, manual-only S10U TCP protocol workbench"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<16"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-asyncio>=0.24,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-asyncio>=0.24,<2"]

[project.scripts]
s10u-tool = "s10u_tool.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
